<script>

const APP_URL = 'https://script.google.com/macros/s/AKfycbzE6zjlrA2iTSYsG4upYnk7Gv0PQduWv74r4cRBU-EGPEUnQBrclQl8Pf--FX44xdeeEg/exec';

</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#0F1923}

/* Full-screen iframe — poora screen occupy karta hai */
#app{
  position:fixed;inset:0;
  width:100%;height:100%;
  border:none;
  display:block;
  background:#0F1923;
}

/* Splash screen */
#splash{
  position:fixed;inset:0;
  background:#0F1923;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;z-index:100;
  transition:opacity .4s ease;
}
#splash.hide{opacity:0;pointer-events:none}
.bolt{font-size:60px;line-height:1;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
.stitle{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em;font-family:'Segoe UI',system-ui,sans-serif}
.sdept{font-size:12px;color:#64748B;letter-spacing:.04em;margin-top:3px;text-align:center;padding:0 20px;font-family:'Segoe UI',system-ui,sans-serif}
.sbar{width:160px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:10px}
.sprog{height:100%;width:0%;background:linear-gradient(90deg,#2563EB,#3B82F6);border-radius:2px;transition:width .1s linear}
.smsg{font-size:12px;color:#64748B;font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>

<!-- Full-screen app iframe — koi topbar nahi, koi wrapper nahi -->
<iframe id="app"
  sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-top-navigation"
  allow="camera; microphone"
></iframe>

<!-- Splash (app load hone tak dikhta hai) -->
<div id="splash">
  <div class="bolt">⚡</div>
  <div>
    <div class="stitle">SP5 Electrical</div>
    <div class="sdept">SP-5 Screening Plant · Electrical Dept.</div>
  </div>
  <div class="sbar"><div class="sprog" id="prog"></div></div>
  <div class="smsg" id="smsg">Connecting...</div>
</div>

<script>
(function(){
  const frame  = document.getElementById('app');
  const splash = document.getElementById('splash');
  const prog   = document.getElementById('prog');
  const smsg   = document.getElementById('smsg');

  const msgs = [[0,'Connecting...'],[30,'Loading data...'],[65,'Preparing...'],[88,'Almost ready...']];
  let pct = 0;
  const timer = setInterval(()=>{
    pct = Math.min(pct + (pct < 70 ? 2 : 0.4), 95);
    prog.style.width = pct + '%';
    const m = msgs.slice().reverse().find(([p]) => pct >= p);
    if(m) smsg.textContent = m[1];
  }, 80);

  function hideSplash(){
    clearInterval(timer);
    prog.style.width = '100%';
    smsg.textContent = 'Ready!';
    setTimeout(()=> splash.classList.add('hide'), 300);
    setTimeout(()=> splash.style.display = 'none', 750);
  }

  frame.src = APP_URL;
  frame.addEventListener('load', hideSplash);
  setTimeout(()=>{ if(!splash.classList.contains('hide')) hideSplash(); }, 9000);
})();
</script>

<!-- PWA Manifest -->
<script>
(function(){
  const m = {
    name:'SP5 Electrical Management',short_name:'SP5 Elec',
    start_url:'./',display:'standalone',orientation:'any',
    background_color:'#0F1923',theme_color:'#0F1923',
    icons:[{
      src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%230F1923'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='320'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E",
      sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'
    }]
  };
  const b = new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
  const l = document.createElement('link');
  l.rel='manifest'; l.href=URL.createObjectURL(b);
  document.head.appendChild(l);
})();
</script>
</body>
</html>
